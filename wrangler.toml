name = "zentro"
account_id = "e0de0498498ec3ce30901af659c5bb1f"
compatibility_date = "2025-01-01"
main = "src/worker.js"
workers_dev = false

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "zentro"
database_id = "72104c06-d099-43fc-8d6f-7a231aa123f2"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zentro"

# Staging environment configuration
[vars]
ENVIRONMENT = "staging"
SITE_NAME = "Zentro Store"

# Routes - assign Worker to domain (staging + production)
[[routes]]
pattern = "zentrostore.pk/*"
zone_id = "65b83231b251c2bd0e4a885c01bf779a"

[[routes]]
pattern = "staging.zentrostore.pk/*"
zone_id = "65b83231b251c2bd0e4a885c01bf779a"

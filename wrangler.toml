name = "zentro"
account_id = "e05bf6df44a164c1b6e5974ca3aa3186"
compatibility_date = "2025-01-01"
main = "src/worker.js"
workers_dev = false

# D1 Database binding (optional - create via wrangler d1 create zentro if needed)
# R2 Bucket binding (optional - create via wrangler r2 bucket create zentro if needed)

# Staging environment configuration
[vars]
ENVIRONMENT = "staging"
